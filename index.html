<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUDADA-jpg</title>
<meta name="description" content="CUDADA-jpg 的个人主页">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1c1b19;
    --muted: #6b6861;
    --line: #e6e3dc;
    --card: #ffffff;
    --accent: #c8502a;
    --accent-soft: #fbe9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141311;
      --fg: #ebe8e1;
      --muted: #9b978e;
      --line: #2a2825;
      --card: #1d1c19;
      --accent: #f08a62;
      --accent-soft: #3a241b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141311;
    --fg: #ebe8e1;
    --muted: #9b978e;
    --line: #2a2825;
    --card: #1d1c19;
    --accent: #f08a62;
    --accent-soft: #3a241b;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 16px 96px;
  }
  header { margin-bottom: 56px; }
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 24px;
    background: var(--card);
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.2;
  }
  .tagline { color: var(--muted); margin: 0 0 20px; font-size: 1.05rem; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.92rem;
    background: var(--card);
    transition: border-color .15s, color .15s;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  .links svg { width: 16px; height: 16px; fill: currentColor; }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 48px 0 16px;
    font-weight: 600;
  }
  section p { margin: 0 0 12px; }
  .projects { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
  .project {
    display: block;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .project:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .project-name { font-weight: 600; font-size: 1.05rem; }
  .project-meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .project-desc { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem; }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: inherit; }
  @media (max-width: 480px) {
    main { padding-top: 48px; }
    h1 { font-size: 1.7rem; }
    .project-head { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" src="https://github.com/CUDADA-jpg.png?size=176" alt="CUDADA-jpg 的头像" width="88" height="88">
    <h1>CUDADA-jpg</h1>
    <p class="tagline">写代码，也写故事。</p>
    <ul class="links">

  <section id="about">

    <p>你好，我是 CUDADA-jpg。这里是我的个人主页，用来放我做过的东西和正在折腾的项目。</p>
    <p>平时的兴趣是做小游戏、写一点交互叙事，也会研究 AI 相关的工具。</p>

  <section id="projects">

      <li>

          <div class="project-head">
            <span class="project-name">her-words</span>

  <footer>
    © <span id="year"></span> CUDADA-jpg · 本页托管于 <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>

</html>
