<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUDADA-jpg</title>
<meta name="description" content="CUDADA-jpg 的个人主页">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1c1b19;
    --muted: #6b6861;
    --line: #e6e3dc;
    --card: #ffffff;
    --accent: #c8502a;
    --accent-soft: #fbe9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141311;
      --fg: #ebe8e1;
      --muted: #9b978e;
      --line: #2a2825;
      --card: #1d1c19;
      --accent: #f08a62;
      --accent-soft: #3a241b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141311;
    --fg: #ebe8e1;
    --muted: #9b978e;
    --line: #2a2825;
    --card: #1d1c19;
    --accent: #f08a62;
    --accent-soft: #3a241b;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 16px 96px;
  }
  header {
    margin-bottom: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 32px;
  }
  .intro { min-width: 0; }
  .greet {
    flex: 0 0 auto;
    width: 220px;
    height: 220px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    position: relative;
  }
  .greet::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: radial-gradient(circle at 30% 30%, var(--accent-soft), transparent 55%);
    pointer-events: none;
  }
  .greet-word {
    position: relative;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    text-align: center;
    padding: 0 12px;
    color: var(--fg);
    animation: greet-in .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .greet-word.out { animation: greet-out .35s ease-in both; }
  .greet-lang {
    position: relative;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  @keyframes greet-in {
    from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  @keyframes greet-out {
    from { opacity: 1; transform: translateY(0);     filter: blur(0); }
    to   { opacity: 0; transform: translateY(-14px); filter: blur(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .greet-word, .greet-word.out { animation: none; }
  }
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 24px;
    background: var(--card);
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.2;
  }
  .tagline { color: var(--muted); margin: 0 0 20px; font-size: 1.05rem; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.92rem;
    background: var(--card);
    transition: border-color .15s, color .15s;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  .links svg { width: 16px; height: 16px; fill: currentColor; }
  .pill-music {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    font: inherit; font-size: 0.92rem;
    background: var(--card);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .pill-music:hover { border-color: var(--accent); color: var(--accent); }
  .pill-music.playing { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .pill-music.playing .pill-note { animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-2px) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) { .pill-music.playing .pill-note { animation: none; } }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 48px 0 16px;
    font-weight: 600;
  }
  section p { margin: 0 0 12px; }
  .projects { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
  .project {
    display: block;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .project:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .project-name { font-weight: 600; font-size: 1.05rem; }
  .project-meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .project-desc { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem; }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
  .player {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }
  .play {
    flex: 0 0 auto;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform .15s, filter .15s;
  }
  .play:hover { filter: brightness(1.08); transform: scale(1.04); }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
  .play .ico-pause { display: none; }
  .player.playing .ico-play { display: none; }
  .player.playing .ico-pause { display: block; }
  .track { flex: 1; min-width: 0; }
  .track-idx { color: var(--muted); font-weight: 400; font-size: 0.82rem; margin-left: 4px; }
  .next {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .15s, color .15s;
  }
  .next:hover { border-color: var(--accent); color: var(--accent); }
  .next svg { width: 18px; height: 18px; fill: currentColor; }
  .track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .track-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-time { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seek {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; margin: 0;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%));
    outline: none; cursor: pointer;
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card);
    box-shadow: 0 0 0 1px var(--line);
  }
  .seek::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card);
  }
  .pet {
    position: fixed;
    left: 0; bottom: 6px;
    width: 48px; height: 45px;
    z-index: 50;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    touch-action: manipulation;
  }
  .pet-body {
    width: 100%; height: 100%;
    transform-origin: 50% 100%;
  }
  .pet-sprite { width: 100%; height: 100%; display: block; }
  .pet.walking .pet-body { animation: pet-walk .36s steps(2, jump-none) infinite; }
  .pet.hop .pet-body { animation: pet-hop .5s cubic-bezier(.3,.9,.4,1) 1; }
  .pet.flip .pet-sprite { transform: scaleX(-1); }
  @keyframes pet-walk {
    0%   { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-3px) rotate(3deg); }
  }
  @keyframes pet-hop {
    0%   { transform: translateY(0) scale(1, 1); }
    25%  { transform: translateY(-26px) scale(.9, 1.1); }
    60%  { transform: translateY(0) scale(1.1, .9); }
    80%  { transform: translateY(-8px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .pet-spark {
    position: fixed;
    width: 4px; height: 4px;
    background: var(--accent);
    pointer-events: none;
    z-index: 49;
    animation: spark .6s ease-out forwards;
  }
  @keyframes spark {
    from { opacity: 1; transform: translate(0, 0); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pet.walking .pet-body, .pet.hop .pet-body { animation: none; }
  }
  .cloud {
    position: fixed;
    left: 0; bottom: 0;
    width: 72px; height: 44px;
    z-index: 48;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    touch-action: manipulation;
  }
  .cloud-body { width: 100%; height: 100%; animation: cloud-bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  .cloud-sprite { width: 100%; height: 100%; display: block; }
  .cloud.flip .cloud-sprite { transform: scaleX(-1); }
  .cloud.squish .cloud-body { animation: cloud-squish .5s ease-out 1; }
  @keyframes cloud-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  @keyframes cloud-squish {
    0%   { transform: scale(1, 1); }
    30%  { transform: scale(1.15, .8); }
    60%  { transform: scale(.95, 1.08); }
    100% { transform: scale(1, 1); }
  }
  .rain-drop {
    position: fixed;
    width: 3px; height: 7px;
    border-radius: 2px;
    background: #6fa8dc;
    pointer-events: none;
    z-index: 47;
    animation: rain .7s ease-in forwards;
  }
  @keyframes rain {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(var(--fall)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud-body, .cloud.squish .cloud-body { animation: none; }
  }
  .latte {
    position: fixed;
    left: 0; bottom: 6px;
    width: 48px; height: 42px;
    z-index: 50;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    touch-action: manipulation;
  }
  .latte-body { position: relative; width: 100%; height: 100%; transform-origin: 50% 100%; }
  .latte-sprite { width: 100%; height: 100%; display: block; }
  .latte.flip .latte-sprite { transform: scaleX(-1); }
  .latte.hop .latte-body { animation: latte-hop .42s cubic-bezier(.3,.9,.4,1) 1; }
  .latte.cheer .latte-body { animation: latte-cheer .6s ease-out 1; }
  @keyframes latte-hop {
    0%   { transform: translateY(0) scale(1, 1); }
    20%  { transform: translateY(-2px) scale(1.1, .9); }
    55%  { transform: translateY(-14px) scale(.95, 1.05); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes latte-cheer {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.15, .85); }
    50%  { transform: translateY(-16px) scale(.95, 1.1); }
    75%  { transform: translateY(0) scale(1.05, .95); }
    100% { transform: scale(1, 1); }
  }
  .steam {
    position: absolute;
    top: -2px;
    width: 3px; height: 8px;
    border-radius: 2px;
    background: var(--muted);
    opacity: 0;
    animation: steam 2.2s ease-out infinite;
  }
  .steam.s1 { left: 12px; animation-delay: 0s; }
  .steam.s2 { left: 20px; animation-delay: .7s; }
  .steam.s3 { left: 28px; animation-delay: 1.4s; }
  @keyframes steam {
    0%   { opacity: 0;   transform: translateY(0) scaleY(.6); }
    20%  { opacity: .55; }
    100% { opacity: 0;   transform: translateY(-16px) translateX(2px) scaleY(1.2); }
  }
  .latte-heart {
    position: fixed;
    width: 12px; height: 12px;
    pointer-events: none;
    z-index: 51;
    animation: heart-up 1s ease-out forwards;
  }
  .latte-heart svg { width: 100%; height: 100%; display: block; }
  @keyframes heart-up {
    from { opacity: 1; transform: translateY(0) scale(.6); }
    40%  { opacity: 1; transform: translateY(-14px) scale(1.1); }
    to   { opacity: 0; transform: translateY(-40px) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .steam, .latte.hop .latte-body, .latte.cheer .latte-body { animation: none; }
  }
  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: inherit; }
  @media (max-width: 640px) {
    .greet { width: 170px; height: 170px; }
    .greet-word { font-size: 1.6rem; }
  }
  @media (max-width: 480px) {
    main { padding-top: 48px; }
    h1 { font-size: 1.7rem; }
    .project-head { flex-direction: column; gap: 2px; }
    header { flex-direction: column; align-items: flex-start; gap: 28px; }
    .greet { width: 100%; height: 150px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="intro">
    <img class="avatar" src="https://github.com/CUDADA-jpg.png?size=176" alt="CUDADA-jpg 的头像" width="88" height="88">
    <h1>CUDADA-jpg</h1>
    <p class="tagline">AI native, HCI</p>
    <ul class="links">
      <li><a href="https://github.com/CUDADA-jpg" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub</a></li>
      <li><button class="pill-music" id="pill-music" type="button" aria-label="播放" title="The Little Things">
        <span class="pill-note" aria-hidden="true">🎵</span>
        <span class="pill-text" id="pill-text">The Little Things</span>
      </button></li>
    </ul>
    </div>
    <div class="greet" aria-live="polite">
      <div class="greet-word" id="greet-word">你好</div>
      <div class="greet-lang" id="greet-lang">中文</div>
    </div>
  </header>

  <section id="about">
    <h2>关于我</h2>
    <p>Let AI education be enjoyable and effective.</p>
  </section>

  <section id="tv">
    <h2 style="text-transform:none">randomness TV</h2>
    <a class="project" href="randomness-tv/">
      <div class="project-head">
        <span class="project-name">频道表 · 5 个频道</span>
        <span class="project-meta">像素动画 · 实时 3D</span>
      </div>
      <p class="project-desc">随便做的小电视：四集像素动画讲 DeepSeek 的论文（DSec、V4.1-Flash、V4、mHC），外加一集云海小岛上的《道德经》。</p>
    </a>
  </section>
  <section id="music">
    <h2>正在听</h2>
    <div class="player" id="player">
      <button class="play" id="play" aria-label="播放">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <div class="track">
        <div class="track-head">
          <span class="track-name"><span id="track-name">The Little Things</span> <span class="track-idx" id="track-idx">1 / 2</span></span>
          <span class="track-time"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
        </div>
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="进度">
      </div>
      <button class="next" id="next" type="button" aria-label="下一首" title="下一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8 6-8 6V6zm10 0h2v12h-2z"/></svg>
      </button>
      <audio id="audio" preload="metadata"></audio>
    </div>
  </section>


  <footer>
    © <span id="year"></span> CUDADA-jpg · 本页托管于 <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
  </footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function () {
  var greetings = [
    ['你好', '中文'],
    ['Hello', 'English'],
    ['Bonjour', 'Français'],
    ['안녕하세요', '한국어'],
    ['Hola', 'Español']
  ];
  var word = document.getElementById('greet-word');
  var lang = document.getElementById('greet-lang');
  var i = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(n) {
    word.textContent = greetings[n][0];
    lang.textContent = greetings[n][1];
    word.classList.remove('out');
    void word.offsetWidth; // restart animation
  }
  function next() {
    i = (i + 1) % greetings.length;
    if (reduce) { show(i); return; }
    word.classList.add('out');
    setTimeout(function () { show(i); }, 350);
  }
  setInterval(next, 1800);
})();

(function () {
  var audio = document.getElementById('audio');
  var player = document.getElementById('player');
  var btn = document.getElementById('play');
  var seek = document.getElementById('seek');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var seeking = false;

  function fmt(t) {
    if (!isFinite(t)) return '0:00';
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function paint(ratio) {
    seek.value = Math.round(ratio * 1000);
    seek.style.setProperty('--p', (ratio * 100) + '%');
  }

  var pill = document.getElementById('pill-music');
  var pillText = document.getElementById('pill-text');
  var trackName = document.getElementById('track-name');
  var trackIdx = document.getElementById('track-idx');
  var nextBtn = document.getElementById('next');

  var tracks = [
    { name: 'The Little Things', src: 'music/the-little-things.m4a' },
    { name: 'Hiphop', src: 'music/hiphop.m4a' }
  ];
  var ti = 0;

  function load(n, autoplay) {
    ti = (n + tracks.length) % tracks.length;
    audio.src = tracks[ti].src;
    pillText.textContent = tracks[ti].name;
    trackName.textContent = tracks[ti].name;
    trackIdx.textContent = (ti + 1) + ' / ' + tracks.length;
    pill.title = tracks[ti].name;
    cur.textContent = '0:00'; dur.textContent = '0:00'; paint(0);
    if (autoplay) audio.play();
  }
  load(0, false);

  function toggle() { if (audio.paused) audio.play(); else audio.pause(); }
  btn.addEventListener('click', toggle);
  pill.addEventListener('click', toggle);
  nextBtn.addEventListener('click', function () { load(ti + 1, !audio.paused); });
  audio.addEventListener('play', function () {
    player.classList.add('playing'); pill.classList.add('playing');
    btn.setAttribute('aria-label', '暂停'); pill.setAttribute('aria-label', '暂停');
  });
  audio.addEventListener('pause', function () {
    player.classList.remove('playing'); pill.classList.remove('playing');
    btn.setAttribute('aria-label', '播放'); pill.setAttribute('aria-label', '播放');
  });
  audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () {
    if (seeking || !audio.duration) return;
    cur.textContent = fmt(audio.currentTime);
    paint(audio.currentTime / audio.duration);
  });
  audio.addEventListener('ended', function () { load(ti + 1, true); });
  seek.addEventListener('input', function () {
    seeking = true;
    var r = seek.value / 1000;
    paint(r);
    if (audio.duration) cur.textContent = fmt(r * audio.duration);
  });
  seek.addEventListener('change', function () {
    if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
    seeking = false;
  });
})();

(function () {
  var pet = document.getElementById('pet');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 48;
  var x = Math.min(120, Math.max(0, window.innerWidth / 2 - W / 2));
  var target = x, speed = 0, dir = 1;
  var state = 'idle', until = 0, last = 0;

  function maxX() { return Math.max(0, window.innerWidth - W); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function pickWalk(now) {
    target = rand(0, maxX());
    if (Math.abs(target - x) < 40) target = x + (x < maxX() / 2 ? 1 : -1) * rand(80, 200);
    target = Math.max(0, Math.min(maxX(), target));
    speed = rand(45, 90);
    dir = target > x ? 1 : -1;
    pet.classList.toggle('flip', dir < 0);
    state = 'walk';
    pet.classList.add('walking');
  }
  function pickIdle(now) {
    state = 'idle';
    until = now + rand(900, 3200);
    pet.classList.remove('walking');
  }
  function hop() {
    pet.classList.remove('hop');
    void pet.offsetWidth;
    pet.classList.add('hop');
  }
  function sparkle() {
    var r = pet.getBoundingClientRect();
    for (var i = 0; i < 6; i++) {
      var s = document.createElement('div');
      s.className = 'pet-spark';
      s.style.left = (r.left + r.width / 2) + 'px';
      s.style.top = (r.top + r.height / 3) + 'px';
      var a = Math.random() * Math.PI * 2, d = rand(18, 40);
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * d - 20) + 'px');
      document.body.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), 650);
    }
  }

  pet.style.transform = 'translateX(' + x + 'px)';
  if (reduce) { x = 24; pet.style.transform = 'translateX(24px)'; }

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'walk') {
      x += dir * speed * dt;
      if ((dir > 0 && x >= target) || (dir < 0 && x <= target)) { x = target; pickIdle(now); if (Math.random() < 0.25) hop(); }
    } else if (now >= until) {
      pickWalk(now);
    }
    x = Math.max(0, Math.min(maxX(), x));
    pet.style.transform = 'translateX(' + x + 'px)';
    requestAnimationFrame(frame);
  }
  if (!reduce) { pickIdle(0); requestAnimationFrame(frame); }

  pet.addEventListener('click', function () {
    hop(); sparkle();
    if (!reduce) { state = 'idle'; until = performance.now() + 900; pet.classList.remove('walking'); }
  });
  pet.addEventListener('animationend', function (e) { if (e.animationName === 'pet-hop') pet.classList.remove('hop'); });
  window.addEventListener('resize', function () { x = Math.min(x, maxX()); });
})();

(function () {
  var cloud = document.getElementById('cloud');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 72, H = 44;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function maxX() { return Math.max(0, window.innerWidth - W); }
  var x = Math.min(maxX(), window.innerWidth * 0.65);
  var y = 92;                      // distance from bottom
  var tx = x, ty = y, vx = 0, vy = 0, dir = 1, last = 0;
  var resting = 0;

  function apply() { cloud.style.transform = 'translate(' + x + 'px, ' + (-y) + 'px)'; }
  function pick() {
    tx = rand(0, maxX());
    if (Math.abs(tx - x) < 60) tx = Math.max(0, Math.min(maxX(), x + (x < maxX() / 2 ? 1 : -1) * rand(120, 260)));
    ty = rand(70, Math.max(80, Math.min(170, window.innerHeight * 0.3)));
    var sp = rand(18, 34);
    var dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
    vx = dx / d * sp; vy = dy / d * sp;
    dir = dx >= 0 ? 1 : -1;
    cloud.classList.toggle('flip', dir < 0);
  }
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (resting > 0) { resting -= dt; if (resting <= 0) pick(); }
    else {
      x += vx * dt; y += vy * dt;
      if ((vx >= 0 && x >= tx) || (vx < 0 && x <= tx)) { x = tx; y = ty; vx = vy = 0; resting = rand(1.5, 4); }
    }
    x = Math.max(0, Math.min(maxX(), x));
    apply();
    requestAnimationFrame(frame);
  }
  apply();
  if (!reduce) { resting = 1; requestAnimationFrame(frame); }

  function rain() {
    var r = cloud.getBoundingClientRect();
    for (var i = 0; i < 9; i++) {
      var d = document.createElement('div');
      d.className = 'rain-drop';
      d.style.left = (r.left + 8 + Math.random() * (r.width - 16)) + 'px';
      d.style.top = (r.bottom - 6) + 'px';
      d.style.setProperty('--fall', rand(40, 80) + 'px');
      d.style.animationDelay = (Math.random() * 0.25) + 's';
      document.body.appendChild(d);
      setTimeout(function (el) { el.remove(); }.bind(null, d), 1100);
    }
  }
  cloud.addEventListener('click', function () {
    cloud.classList.remove('squish'); void cloud.offsetWidth; cloud.classList.add('squish');
    rain();
    if (!reduce) { vx = vy = 0; resting = 1.2; }
  });
  cloud.addEventListener('animationend', function (e) { if (e.animationName === 'cloud-squish') cloud.classList.remove('squish'); });
  window.addEventListener('resize', function () { x = Math.min(x, maxX()); apply(); });
})();

(function () {
  var latte = document.getElementById('latte');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 48;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function maxX() { return Math.max(0, window.innerWidth - W); }
  var x = Math.min(maxX(), Math.max(0, window.innerWidth * 0.35));
  var hopsLeft = 0, dir = 1, timer = null;

  function apply() { latte.style.transform = 'translateX(' + x + 'px)'; }
  function hopOnce() {
    latte.classList.remove('hop'); void latte.offsetWidth; latte.classList.add('hop');
    var start = x, dist = dir * rand(22, 34), t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / 420);
      x = Math.max(0, Math.min(maxX(), start + dist * k));
      apply();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  function plan() {
    hopsLeft = Math.round(rand(2, 5));
    dir = Math.random() < 0.5 ? -1 : 1;
    if (x < 60) dir = 1; if (x > maxX() - 60) dir = -1;
    latte.classList.toggle('flip', dir < 0);
    burst();
  }
  function burst() {
    if (hopsLeft <= 0) { timer = setTimeout(plan, rand(1200, 3500)); return; }
    hopsLeft--; hopOnce();
    timer = setTimeout(burst, 520);
  }
  apply();
  if (!reduce) timer = setTimeout(plan, 1500);

  function heart() {
    var r = latte.getBoundingClientRect();
    var h = document.createElement('div');
    h.className = 'latte-heart';
    h.style.left = (r.left + r.width / 2 - 6) + 'px';
    h.style.top = (r.top - 6) + 'px';
    h.innerHTML = '<svg viewBox="0 0 10 9" shape-rendering="crispEdges"><path fill="#e0565b" d="M1 1h2v1h1v1h2V2h1V1h2v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1z"/></svg>';
    document.body.appendChild(h);
    setTimeout(function () { h.remove(); }, 1100);
  }
  latte.addEventListener('click', function () {
    latte.classList.remove('cheer'); void latte.offsetWidth; latte.classList.add('cheer');
    heart();
    if (!reduce) { clearTimeout(timer); hopsLeft = 0; timer = setTimeout(plan, 1500); }
  });
  latte.addEventListener('animationend', function (e) {
    if (e.animationName === 'latte-hop') latte.classList.remove('hop');
    if (e.animationName === 'latte-cheer') latte.classList.remove('cheer');
  });
  window.addEventListener('resize', function () { x = Math.min(x, maxX()); apply(); });
})();
</script>
