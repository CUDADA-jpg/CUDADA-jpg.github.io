<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUDADA-jpg</title>
<meta name="description" content="CUDADA-jpg 的个人主页">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1c1b19;
    --muted: #6b6861;
    --line: #e6e3dc;
    --card: #ffffff;
    --accent: #c8502a;
    --accent-soft: #fbe9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141311;
      --fg: #ebe8e1;
      --muted: #9b978e;
      --line: #2a2825;
      --card: #1d1c19;
      --accent: #f08a62;
      --accent-soft: #3a241b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141311;
    --fg: #ebe8e1;
    --muted: #9b978e;
    --line: #2a2825;
    --card: #1d1c19;
    --accent: #f08a62;
    --accent-soft: #3a241b;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 16px 96px;
  }
  header {
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
  }
  .intro { min-width: 0; }
  .intro #about h2 { margin-top: 40px; }
  .side { flex: 0 0 auto; width: 220px; display: flex; flex-direction: column; gap: 14px; }
  .greet {
    width: 100%;
    height: 220px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    position: relative;
  }
  .greet::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: radial-gradient(circle at 30% 30%, var(--accent-soft), transparent 55%);
    pointer-events: none;
  }
  .greet-word {
    position: relative;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    text-align: center;
    padding: 0 12px;
    color: var(--fg);
    animation: greet-in .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .greet-word.out { animation: greet-out .35s ease-in both; }
  .greet-lang {
    position: relative;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  @keyframes greet-in {
    from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  @keyframes greet-out {
    from { opacity: 1; transform: translateY(0);     filter: blur(0); }
    to   { opacity: 0; transform: translateY(-14px); filter: blur(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .greet-word, .greet-word.out { animation: none; }
  }
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 24px;
    background: var(--card);
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.2;
  }
  .tagline { color: var(--muted); margin: 0 0 20px; font-size: 1.05rem; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.92rem;
    background: var(--card);
    transition: border-color .15s, color .15s;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  .links svg { width: 16px; height: 16px; fill: currentColor; }
  .pill-music {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    font: inherit; font-size: 0.92rem;
    background: var(--card);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .pill-music:hover { border-color: var(--accent); color: var(--accent); }
  .pill-music.playing { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .pill-music.playing .pill-note { animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-2px) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) { .pill-music.playing .pill-note { animation: none; } }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 48px 0 16px;
    font-weight: 600;
  }
  section p { margin: 0 0 12px; }
  .projects { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
  .project {
    display: block;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .project:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .project-name { font-weight: 600; font-size: 1.05rem; }
  .project-meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .project-desc { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem; }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
  .player {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }
  .play {
    flex: 0 0 auto;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform .15s, filter .15s;
  }
  .play:hover { filter: brightness(1.08); transform: scale(1.04); }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
  .play .ico-pause { display: none; }
  .player.playing .ico-play { display: none; }
  .player.playing .ico-pause { display: block; }
  .track { flex: 1; min-width: 0; }
  .track-idx { color: var(--muted); font-weight: 400; font-size: 0.82rem; margin-left: 4px; }
  .next {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .15s, color .15s;
  }
  .next:hover { border-color: var(--accent); color: var(--accent); }
  .next svg { width: 18px; height: 18px; fill: currentColor; }
  .track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .track-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-time { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seek {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; margin: 0;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%));
    outline: none; cursor: pointer;
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card);
    box-shadow: 0 0 0 1px var(--line);
  }
  .seek::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card);
  }
  /* ---- claw machine: the three pets live inside its glass now ---- */
  .machine {
    position: relative; width: 100%;
    border: 1px solid var(--line); border-radius: 18px; background: var(--card);
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .cm-top { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px 7px; border-bottom: 1px solid var(--line); }
  .cm-title { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .cm-lights { display: flex; gap: 4px; }
  .cm-lights i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: cm-blink 1.2s steps(1) infinite; }
  .cm-lights i:nth-child(2n) { animation-delay: .6s; }
  @keyframes cm-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .3; } }
  .cm-glass {
    position: relative; height: 150px; margin: 10px 12px 0;
    border-radius: 10px; border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--accent-soft) 0%, var(--card) 75%);
    overflow: hidden;
  }
  .cm-glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 38%); pointer-events: none; z-index: 6; }
  .cm-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; border-top: 1px solid var(--line);
    background: repeating-linear-gradient(90deg, var(--accent-soft) 0 6px, transparent 6px 12px); }
  .cm-rail { position: absolute; left: 8px; right: 8px; top: 5px; height: 3px; border-radius: 2px; background: var(--line); }
  .claw { position: absolute; top: 6px; left: 0; width: 30px; z-index: 5; pointer-events: none; transition: left .9s cubic-bezier(.45,0,.2,1); }
  .claw-rope { width: 2px; height: 14px; margin: 0 auto; background: var(--muted); transition: height .7s cubic-bezier(.45,0,.2,1); }
  .claw-head { width: 30px; height: 24px; display: block; transform-origin: 50% 0; animation: claw-sway 2.8s ease-in-out infinite; }
  .machine.busy .claw-head { animation: none; }
  @keyframes claw-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .prong { transform-box: fill-box; transition: transform .25s ease; }
  .prong-l { transform-origin: 100% 0; }
  .prong-r { transform-origin: 0 0; }
  .claw.closed .prong-l { transform: rotate(-30deg); }
  .claw.closed .prong-r { transform: rotate(30deg); }
  .cm-panel { display: flex; align-items: center; gap: 12px; padding: 10px 14px 12px; }
  .cm-stick { position: relative; width: 26px; height: 30px; flex: 0 0 auto; transform-origin: 50% 100%; transition: transform .3s; }
  .cm-stick::before { content: ""; position: absolute; left: 11px; bottom: 4px; width: 4px; height: 18px; border-radius: 2px; background: var(--muted); }
  .cm-stick::after { content: ""; position: absolute; left: 5px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #e0565b; box-shadow: inset -3px -3px 0 rgba(0,0,0,.18); }
  .cm-stick i { position: absolute; left: 3px; bottom: 0; width: 20px; height: 6px; border-radius: 3px; background: var(--line); }
  .machine.busy .cm-stick { transform: rotate(-16deg); }
  .cm-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; flex: 0 0 auto; cursor: pointer;
    background: var(--accent); box-shadow: 0 3px 0 rgba(0,0,0,.28), inset 0 -2px 0 rgba(0,0,0,.12); transition: transform .1s, box-shadow .1s; }
  .cm-btn:active, .machine.busy .cm-btn { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,.28), inset 0 -2px 0 rgba(0,0,0,.12); }
  .cm-btn:disabled { cursor: default; }
  .cm-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .cm-label { font-size: 0.72rem; color: var(--muted); line-height: 1.35; min-width: 0; }
  .cm-label b { display: block; color: var(--fg); font-size: 0.86rem; font-weight: 600; }
  .cm-coin { margin-left: auto; width: 6px; height: 16px; border-radius: 2px; background: var(--line); box-shadow: inset 0 0 0 1px var(--muted); flex: 0 0 auto; }
  @media (prefers-reduced-motion: reduce) {
    .cm-lights i, .claw-head { animation: none; }
    .claw, .claw-rope, .prong, .cm-stick, .pet, .cloud, .latte { transition: none !important; }
  }
  .pet, .cloud, .latte {
    position: absolute; cursor: pointer; z-index: 3;
    user-select: none; -webkit-user-select: none; will-change: transform; touch-action: manipulation;
    transition: transform .3s cubic-bezier(.45,0,.2,1);
  }
  .pet { left: 11%; bottom: 10px; width: 40px; height: 38px; }
  .pet-body {
    width: 100%; height: 100%;
    transform-origin: 50% 100%;
  }
  .pet-sprite { width: 100%; height: 100%; display: block; }
  .pet.hop .pet-body { animation: pet-hop .5s cubic-bezier(.3,.9,.4,1) 1; }
  @keyframes pet-walk {
    0%   { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-3px) rotate(3deg); }
  }
  @keyframes pet-hop {
    0%   { transform: translateY(0) scale(1, 1); }
    25%  { transform: translateY(-26px) scale(.9, 1.1); }
    60%  { transform: translateY(0) scale(1.1, .9); }
    80%  { transform: translateY(-8px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .pet-spark {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--accent);
    pointer-events: none;
    z-index: 49;
    animation: spark .6s ease-out forwards;
  }
  @keyframes spark {
    from { opacity: 1; transform: translate(0, 0); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pet.hop .pet-body { animation: none; }
  }
  .cloud { left: 50%; margin-left: -28px; bottom: 58px; width: 56px; height: 34px; z-index: 2; }
  .cloud-body { width: 100%; height: 100%; animation: cloud-bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  .cloud-sprite { width: 100%; height: 100%; display: block; }
  .cloud.squish .cloud-body { animation: cloud-squish .5s ease-out 1; }
  @keyframes cloud-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  @keyframes cloud-squish {
    0%   { transform: scale(1, 1); }
    30%  { transform: scale(1.15, .8); }
    60%  { transform: scale(.95, 1.08); }
    100% { transform: scale(1, 1); }
  }
  .rain-drop {
    position: absolute;
    width: 3px; height: 7px;
    border-radius: 2px;
    background: #6fa8dc;
    pointer-events: none;
    z-index: 47;
    animation: rain .7s ease-in forwards;
  }
  @keyframes rain {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(var(--fall)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud-body, .cloud.squish .cloud-body { animation: none; }
  }
  .latte { right: 11%; bottom: 10px; width: 40px; height: 35px; }
  .latte-body { position: relative; width: 100%; height: 100%; transform-origin: 50% 100%; }
  .latte-sprite { width: 100%; height: 100%; display: block; }
  .latte.hop .latte-body { animation: latte-hop .42s cubic-bezier(.3,.9,.4,1) 1; }
  .latte.cheer .latte-body { animation: latte-cheer .6s ease-out 1; }
  @keyframes latte-hop {
    0%   { transform: translateY(0) scale(1, 1); }
    20%  { transform: translateY(-2px) scale(1.1, .9); }
    55%  { transform: translateY(-14px) scale(.95, 1.05); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes latte-cheer {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.15, .85); }
    50%  { transform: translateY(-16px) scale(.95, 1.1); }
    75%  { transform: translateY(0) scale(1.05, .95); }
    100% { transform: scale(1, 1); }
  }
  .steam {
    position: absolute;
    top: -2px;
    width: 3px; height: 8px;
    border-radius: 2px;
    background: var(--muted);
    opacity: 0;
    animation: steam 2.2s ease-out infinite;
  }
  .steam.s1 { left: 10px; animation-delay: 0s; }
  .steam.s2 { left: 17px; animation-delay: .7s; }
  .steam.s3 { left: 24px; animation-delay: 1.4s; }
  @keyframes steam {
    0%   { opacity: 0;   transform: translateY(0) scaleY(.6); }
    20%  { opacity: .55; }
    100% { opacity: 0;   transform: translateY(-16px) translateX(2px) scaleY(1.2); }
  }
  .latte-heart {
    position: absolute;
    width: 12px; height: 12px;
    pointer-events: none;
    z-index: 51;
    animation: heart-up 1s ease-out forwards;
  }
  .latte-heart svg { width: 100%; height: 100%; display: block; }
  @keyframes heart-up {
    from { opacity: 1; transform: translateY(0) scale(.6); }
    40%  { opacity: 1; transform: translateY(-14px) scale(1.1); }
    to   { opacity: 0; transform: translateY(-40px) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .steam, .latte.hop .latte-body, .latte.cheer .latte-body { animation: none; }
  }
  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: inherit; }
  @media (max-width: 640px) {
    .side { width: 170px; }
    .greet { height: 170px; }
    .greet-word { font-size: 1.6rem; }
    .cm-glass { height: 136px; }
    .cm-label span { display: none; }
  }
  @media (max-width: 480px) {
    main { padding-top: 48px; }
    h1 { font-size: 1.7rem; }
    .project-head { flex-direction: column; gap: 2px; }
    header { flex-direction: column; align-items: flex-start; gap: 28px; }
    .side { width: 100%; }
    .greet { height: 150px; }
    .cm-glass { height: 150px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="intro">
    <img class="avatar" src="https://github.com/CUDADA-jpg.png?size=176" alt="CUDADA-jpg 的头像" width="88" height="88">
    <h1>CUDADA-jpg</h1>
    <p class="tagline">AI native, HCI</p>
    <ul class="links">
      <li><a href="https://github.com/CUDADA-jpg" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub</a></li>
      <li><button class="pill-music" id="pill-music" type="button" aria-label="播放" title="The Little Things">
        <span class="pill-note" aria-hidden="true">🎵</span>
        <span class="pill-text" id="pill-text">The Little Things</span>
      </button></li>
    </ul>
    <section id="about">
      <h2>关于我</h2>
      <p>Let AI education be enjoyable and effective.</p>
    </section>
    </div>
    <div class="side">
      <div class="greet" aria-live="polite">
        <div class="greet-word" id="greet-word">你好</div>
        <div class="greet-lang" id="greet-lang">中文</div>
      </div>
      <div class="machine" id="machine" role="group" aria-label="抓娃娃机，里面有三只像素宠物">
        <div class="cm-top"><span class="cm-title">Claw Machine</span><span class="cm-lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function () {
  var greetings = [
    ['你好', '中文'],
    ['Hello', 'English'],
    ['Bonjour', 'Français'],
    ['안녕하세요', '한국어'],
    ['Hola', 'Español']
  ];
  var word = document.getElementById('greet-word');
  var lang = document.getElementById('greet-lang');
  var i = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(n) {
    word.textContent = greetings[n][0];
    lang.textContent = greetings[n][1];
    word.classList.remove('out');
    void word.offsetWidth; // restart animation
  }
  function next() {
    i = (i + 1) % greetings.length;
    if (reduce) { show(i); return; }
    word.classList.add('out');
    setTimeout(function () { show(i); }, 350);
  }
  setInterval(next, 1800);
})();

(function () {
  var audio = document.getElementById('audio');
  var player = document.getElementById('player');
  var btn = document.getElementById('play');
  var seek = document.getElementById('seek');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var seeking = false;

  function fmt(t) {
    if (!isFinite(t)) return '0:00';
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function paint(ratio) {
    seek.value = Math.round(ratio * 1000);
    seek.style.setProperty('--p', (ratio * 100) + '%');
  }

  var pill = document.getElementById('pill-music');
  var pillText = document.getElementById('pill-text');
  var trackName = document.getElementById('track-name');
  var trackIdx = document.getElementById('track-idx');
  var nextBtn = document.getElementById('next');

  var tracks = [
    { name: 'The Little Things', src: 'music/the-little-things.m4a' },
    { name: 'Hiphop', src: 'music/hiphop.m4a' }
  ];
  var ti = 0;

  function load(n, autoplay) {
    ti = (n + tracks.length) % tracks.length;
    audio.src = tracks[ti].src;
    pillText.textContent = tracks[ti].name;
    trackName.textContent = tracks[ti].name;
    trackIdx.textContent = (ti + 1) + ' / ' + tracks.length;
    pill.title = tracks[ti].name;
    cur.textContent = '0:00'; dur.textContent = '0:00'; paint(0);
    if (autoplay) audio.play();
  }
  load(0, false);

  function toggle() { if (audio.paused) audio.play(); else audio.pause(); }
  btn.addEventListener('click', toggle);
  pill.addEventListener('click', toggle);
  nextBtn.addEventListener('click', function () { load(ti + 1, !audio.paused); });
  audio.addEventListener('play', function () {
    player.classList.add('playing'); pill.classList.add('playing');
    btn.setAttribute('aria-label', '暂停'); pill.setAttribute('aria-label', '暂停');
  });
  audio.addEventListener('pause', function () {
    player.classList.remove('playing'); pill.classList.remove('playing');
    btn.setAttribute('aria-label', '播放'); pill.setAttribute('aria-label', '播放');
  });
  audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () {
    if (seeking || !audio.duration) return;
    cur.textContent = fmt(audio.currentTime);
    paint(audio.currentTime / audio.duration);
  });
  audio.addEventListener('ended', function () { load(ti + 1, true); });
  seek.addEventListener('input', function () {
    seeking = true;
    var r = seek.value / 1000;
    paint(r);
    if (audio.duration) cur.textContent = fmt(r * audio.duration);
  });
  seek.addEventListener('change', function () {
    if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
    seeking = false;
  });
})();

(function () {
  var machine = document.getElementById('machine');
  var glass = document.getElementById('cm-glass');
  var claw = document.getElementById('claw');
  var rope = document.getElementById('claw-rope');
  var btn = document.getElementById('cm-btn');
  var msg = document.getElementById('cm-msg');
  var sub = document.getElementById('cm-sub');
  var pet = document.getElementById('pet');
  var cloud = document.getElementById('cloud');
  var latte = document.getElementById('latte');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var busy = false;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, reduce ? Math.min(ms, 80) : ms); }); }
  function rel(el) { // element box relative to the glass
    var g = glass.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { left: r.left - g.left, top: r.top - g.top, width: r.width, height: r.height, bottom: r.bottom - g.top };
  }
  function pulse(el, cls, body) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }

  // --- the pets' own reactions (same as before, just drawn inside the glass) ---
  function sparkle() {
    var r = rel(pet);
    for (var i = 0; i < 6; i++) {
      var sp = document.createElement('div');
      sp.className = 'pet-spark';
      sp.style.left = (r.left + r.width / 2) + 'px';
      sp.style.top = (r.top + r.height / 3) + 'px';
      var a = Math.random() * Math.PI * 2, d = rand(14, 32);
      sp.style.setProperty('--dx', Math.cos(a) * d + 'px');
      sp.style.setProperty('--dy', (Math.sin(a) * d - 16) + 'px');
      glass.appendChild(sp);
      setTimeout(function (el) { el.remove(); }.bind(null, sp), 650);
    }
  }
  function rain() {
    var r = rel(cloud);
    for (var i = 0; i < 9; i++) {
      var d = document.createElement('div');
      d.className = 'rain-drop';
      d.style.left = (r.left + 6 + Math.random() * (r.width - 12)) + 'px';
      d.style.top = (r.bottom - 4) + 'px';
      d.style.setProperty('--fall', rand(30, 60) + 'px');
      d.style.animationDelay = (Math.random() * 0.25) + 's';
      glass.appendChild(d);
      setTimeout(function (el) { el.remove(); }.bind(null, d), 1100);
    }
  }
  function heart() {
    var r = rel(latte);
    var h = document.createElement('div');
    h.className = 'latte-heart';
    h.style.left = (r.left + r.width / 2 - 6) + 'px';
    h.style.top = (r.top - 4) + 'px';
    h.innerHTML = '<svg viewBox="0 0 10 9" shape-rendering="crispEdges"><path fill="#e0565b" d="M1 1h2v1h1v1h2V2h1V1h2v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1z"/></svg>';
    glass.appendChild(h);
    setTimeout(function () { h.remove(); }, 1100);
  }
  var pets = [
    { el: pet,   name: '星星', react: function () { pulse(pet, 'hop'); sparkle(); } },
    { el: cloud, name: '云朵', react: function () { pulse(cloud, 'squish'); rain(); } },
    { el: latte, name: '拿铁', react: function () { pulse(latte, 'cheer'); heart(); } }
  ];
  pets.forEach(function (p) { p.el.addEventListener('click', p.react); });
  pet.addEventListener('animationend', function (e) { if (e.animationName === 'pet-hop') pet.classList.remove('hop'); });
  cloud.addEventListener('animationend', function (e) { if (e.animationName === 'cloud-squish') cloud.classList.remove('squish'); });
  latte.addEventListener('animationend', function (e) {
    if (e.animationName === 'latte-hop') latte.classList.remove('hop');
    if (e.animationName === 'latte-cheer') latte.classList.remove('cheer');
  });

  // --- the claw ---
  var CLAW_W = 30, ROPE_HOME = 14, HEAD_H = 24, RAIL_TOP = 6;
  function homeX() { return glass.clientWidth / 2 - CLAW_W / 2; }
  function moveClaw(x, ms) { claw.style.transitionDuration = ms + 'ms'; claw.style.left = x + 'px'; return wait(ms + 40); }
  function setRope(h, ms) { rope.style.transitionDuration = ms + 'ms'; rope.style.height = h + 'px'; return wait(ms + 40); }
  function carry(el, dx, dy, ms, ease) {
    el.style.transitionDuration = ms + 'ms';
    el.style.transitionTimingFunction = ease || '';
    el.style.transform = 'translate(' + dx + 'px, ' + (-dy) + 'px)';
    return wait(ms + 40);
  }
  function say(a, b) { msg.textContent = a; if (b !== undefined) sub.textContent = b; }
  claw.style.left = homeX() + 'px';
  window.addEventListener('resize', function () { if (!busy) claw.style.left = homeX() + 'px'; });

  async function play() {
    if (busy) return;
    busy = true; btn.disabled = true; machine.classList.add('busy');
    var p = pets[Math.floor(Math.random() * pets.length)];
    var r = rel(p.el);
    var cx = r.left + r.width / 2 - CLAW_W / 2;
    var ropeDown = Math.max(8, r.top + 8 - RAIL_TOP - HEAD_H);
    say('瞄准' + p.name + '…', '');
    await moveClaw(cx, 900);
    await setRope(ropeDown, 700);
    claw.classList.add('closed');
    await wait(380);
    if (Math.random() < 0.45) {
      say('夹住了！', '往出口送…');
      var lift = ropeDown - ROPE_HOME;
      carry(p.el, 0, lift, 700);
      await setRope(ROPE_HOME, 700);
      var dx = homeX() - cx;
      carry(p.el, dx, lift, 900);
      await moveClaw(homeX(), 900);
      await wait(250);
      claw.classList.remove('closed');
      say('哎呀，掉了', '再来一次？');
      await carry(p.el, 0, 0, 420, 'cubic-bezier(.5,0,.9,.6)');
      p.react();
    } else {
      say('滑掉了…', '差一点');
      carry(p.el, 0, 10, 300);
      await setRope(ropeDown - 10, 300);
      await wait(150);
      claw.classList.remove('closed');
      await carry(p.el, 0, 0, 220, 'cubic-bezier(.5,0,.9,.6)');
      p.react();
      await setRope(ROPE_HOME, 600);
    }
    await moveClaw(homeX(), 800);
    await wait(900);
    say('抓一下', '免费，不用投币');
    machine.classList.remove('busy'); btn.disabled = false; busy = false;
  }
  btn.addEventListener('click', play);
})();
</script>
</body>
</html>
