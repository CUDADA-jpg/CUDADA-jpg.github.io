<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>道德经 云上</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: a full-viewport 3D scene (floating grass island above a sea of clouds, an old sage reading bamboo slips).
   HTML sits on top: a slim top bar, and a chapter card at the bottom that cycles through the Dao De Jing. */
:root{
  --bg:#0b1324;
  --fg:#f6f1e6;
  --dim:#c9c0ad;
  --ink:#2b2117;
  --paper:rgba(250,244,230,.92);
  --gold:#d9a441;
  --line:rgba(255,255,255,.22);
  --brush:"Ma Shan Zheng","Noto Serif SC",serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --pixel:"Press Start 2P",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(5,10,24,.55),rgba(5,10,24,0));pointer-events:none}
.top a,.top span{pointer-events:auto}
.back{font-family:var(--pixel);font-size:10px;color:var(--gold);text-decoration:none;letter-spacing:.04em;text-shadow:0 1px 2px #000}
.back:hover{color:#fff}
.brand{font-family:var(--brush);font-size:22px;color:var(--fg);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.brand small{font-family:var(--pixel);font-size:9px;color:var(--dim);margin-left:10px;letter-spacing:.06em}
.card{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(680px,calc(100vw - 2*max(16px,env(safe-area-inset-left,0px))));
  background:var(--paper);color:var(--ink);border:1px solid rgba(60,40,20,.25);box-shadow:0 10px 40px rgba(0,0,0,.35);
  padding:16px 20px 12px;display:grid;gap:6px;transition:opacity .6s}
.card.fade{opacity:0}
.card .ch{font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:#8a6d3b;font-weight:600}
.card .quote{font-family:var(--brush);font-size:clamp(22px,4vw,32px);line-height:1.35;margin:0;text-wrap:balance}
.card .gloss{margin:0;font-size:14px;line-height:1.7;color:#4a3b2a}
.card .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:10px;height:10px;border:1px solid #8a6d3b;background:transparent;padding:0;cursor:pointer;border-radius:50%}
.dots button[aria-selected="true"]{background:#8a6d3b}
.nav{display:flex;gap:6px}
.nav button{font-family:var(--serif);font-size:13px;color:var(--ink);background:transparent;border:1px solid #8a6d3b;padding:4px 10px;cursor:pointer}
.nav button:hover{background:#8a6d3b;color:#fff}
.nav button:focus-visible,.dots button:focus-visible,.back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));font-size:11px;color:var(--dim);text-shadow:0 1px 2px #000;opacity:.85}
@media (max-width:520px){.hint{display:none}.brand small{display:none}}
</style>

</head>
<body>
<main>
<canvas id="stage" aria-label="云海之上的小岛，老者读竹简"></canvas>
<div class="top">
  <a class="back" href="index.html">&lt; 返回频道表</a>
  <span class="brand">道德经 · 云上<small>RANDOMNESS TV SPECIAL</small></span>
</div>
<div class="hint">拖动旋转 · 滚轮缩放 · ← → 换章</div>
<section class="card" id="card" aria-live="polite">
  <div class="ch" id="chNum"></div>
  <p class="quote" id="chQuote"></p>
  <p class="gloss" id="chGloss"></p>
  <div class="bar">
    <div class="dots" id="dots"></div>
    <div class="nav"><button type="button" id="prev">上一章</button><button type="button" id="play">暂停</button><button type="button" id="next">下一章</button></div>
  </div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('chGloss').textContent='3D 库没有加载出来，请检查网络后刷新。';return;}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- chapters (public-domain text, glosses in plain modern words) ---------- */
const CH=[
 [1,'道可道，非常道。名可名，非常名。','说得出口的道，已经不是那个恒常的道；叫得出名字的名，也不是恒常的名。'],
 [8,'上善若水。水善利万物而不争，处众人之所恶，故几于道。','最高的善像水：滋养万物却不去争，甘居大家都不愿待的低处，所以最接近道。'],
 [11,'三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。','车轮因为中间是空的才能转，陶器因为里面是空的才能装东西：有用的往往是那个「无」。'],
 [16,'致虚极，守静笃。万物并作，吾以观复。','把心放到最空、守到最静，看万物一起生长，再看它们各自回到起点。'],
 [25,'人法地，地法天，天法道，道法自然。','人效法大地，大地效法天，天效法道，道只是顺着它本来的样子。'],
 [33,'知人者智，自知者明。胜人者有力，自胜者强。','看懂别人是聪明，看懂自己才是明白；赢过别人算有力，赢过自己才算强。'],
 [48,'为学日益，为道日损。损之又损，以至于无为。无为而无不为。','求学问是每天往里加，求道是每天往外减；减到最后什么都不勉强去做，反而没有做不成的事。'],
 [63,'天下难事，必作于易；天下大事，必作于细。','天下的难事都从容易处做起，大事都从细微处做起。'],
 [64,'合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。','合抱的大树从一根嫩芽长起，九层的高台从一筐土堆起，千里的路从脚下这一步开始。'],
 [76,'人之生也柔弱，其死也坚强。草木之生也柔脆，其死也枯槁。','活着的东西都是柔软的，死去才变得僵硬；草木活着时柔嫩，枯死了才又干又硬。'],
 [81,'信言不美，美言不信。善者不辩，辩者不善。','可信的话不漂亮，漂亮的话不可信；真正好的人不争辩，爱争辩的人未必好。']
];
const HOLD=16;
let ci=0,ct=0,playing=!reduced;
const card=document.getElementById('card'),chNum=document.getElementById('chNum'),chQuote=document.getElementById('chQuote'),chGloss=document.getElementById('chGloss'),dots=document.getElementById('dots'),playBtn=document.getElementById('play');
const cn=['一','二','三','四','五','六','七','八','九','十'];
const zh=n=>n<10?cn[n-1]:n<20?'十'+(n%10?cn[n%10-1]:''):cn[Math.floor(n/10)-1]+'十'+(n%10?cn[n%10-1]:'');
CH.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-label','第'+c[0]+'章');b.addEventListener('click',()=>show(i));dots.appendChild(b);});
function render(){chNum.textContent='第'+zh(CH[ci][0])+'章';chQuote.textContent=CH[ci][1];chGloss.textContent=CH[ci][2];[...dots.children].forEach((d,i)=>d.setAttribute('aria-selected',i===ci?'true':'false'));}
function show(i){ci=(i+CH.length)%CH.length;ct=0;if(reduced){render();return;}card.classList.add('fade');setTimeout(()=>{render();card.classList.remove('fade');},600);}
function setPlaying(p){playing=p;playBtn.textContent=p?'暂停':'播放';}
document.getElementById('prev').addEventListener('click',()=>show(ci-1));
document.getElementById('next').addEventListener('click',()=>show(ci+1));
playBtn.addEventListener('click',()=>setPlaying(!playing));
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')show(ci+1);else if(e.key==='ArrowLeft')show(ci-1);else if(e.key===' '){e.preventDefault();setPlaying(!playing);}});
render();setPlaying(playing);

/* ---------- helpers ---------- */
const rnd=(function(){let s=1234567;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};})();
function hash2(x,y){const v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v);}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);return (a+(b-a)*fx)+((c+(d-c)*fx)-(a+(b-a)*fx))*fy;}
function fbm(x,y){let v=0,a=.5,f=1;for(let i=0;i<4;i++){v+=a*vnoise(x*f,y*f);f*=2.07;a*=.5;}return v;}
const GLSL_NOISE=`
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(17.,9.);a*=.5;}return v;}`;

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xdfe9f4,70,260);
const camera=new THREE.PerspectiveCamera(42,1,0.1,900);
const SUN=new THREE.Vector3(-0.35,0.42,-0.84).normalize();

/* sky dome */
const sky=new THREE.Mesh(new THREE.SphereGeometry(480,32,16),new THREE.ShaderMaterial({
  uniforms:{uTop:{value:new THREE.Color(0x1f55b8)},uHorizon:{value:new THREE.Color(0xf1e4d0)},uSunDir:{value:SUN},uSunCol:{value:new THREE.Color(0xffe2b0)}},
  vertexShader:`varying vec3 vW;void main(){vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:`uniform vec3 uTop,uHorizon,uSunDir,uSunCol;varying vec3 vW;
   void main(){vec3 d=normalize(vW);float t=clamp(d.y,0.,1.);vec3 c=mix(uHorizon,uTop,pow(t,.42));
   float s=max(dot(d,normalize(uSunDir)),0.);c+=uSunCol*(pow(s,5.)*.45+pow(s,160.)*2.2);gl_FragColor=vec4(c,1.);}`,
  side:THREE.BackSide,depthWrite:false,fog:false}));
scene.add(sky);

/* lights */
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x5a4a30,0.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1.6);sun.position.copy(SUN).multiplyScalar(60);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:10,far:120});sun.shadow.bias=-0.0008;scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.18));

/* cloud sea */
const cloudMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uSun:{value:SUN},uCol:{value:new THREE.Color(0xffffff)},uShade:{value:new THREE.Color(0x7f98c2)},fogColor:{value:scene.fog.color},fogNear:{value:70},fogFar:{value:260}},
  vertexShader:GLSL_NOISE+`uniform float uTime;varying vec3 vN;varying float vH;
   float hgt(vec2 q){vec2 o=vec2(uTime*.016,uTime*.010);float h=fbm(q*.022+o);h=pow(h,1.6)*14.;h+=fbm(q*.09-o*1.5)*1.2;return h;}
   void main(){vec3 p=position;float e=1.5;float h=hgt(p.xy);float hx=hgt(p.xy+vec2(e,0.));float hy=hgt(p.xy+vec2(0.,e));
   p.z+=h;vH=h/15.;vec3 n=normalize(vec3(-(hx-h)/e,-(hy-h)/e,1.));vN=normalize(mat3(modelMatrix)*n);
   vec4 wp=modelMatrix*vec4(p,1.);gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:`uniform vec3 uSun,uCol,uShade,fogColor;uniform float fogNear,fogFar;varying vec3 vN;varying float vH;
   void main(){vec3 n=normalize(vN);float l=clamp(dot(n,normalize(uSun)),0.,1.);
   vec3 c=mix(uShade,uCol,.25+.75*l);c=mix(c,uCol,vH*.35);c+=vec3(1.,.85,.6)*pow(l,12.)*.35;
   float fz=smoothstep(fogNear,fogFar,gl_FragCoord.z/gl_FragCoord.w);c=mix(c,fogColor,fz);
   gl_FragColor=vec4(c,1.);}`});
const clouds=new THREE.Mesh(new THREE.PlaneGeometry(420,420,170,170),cloudMat);
clouds.rotation.x=-Math.PI/2;clouds.position.y=-16;scene.add(clouds);

/* island */
const island=new THREE.Group();scene.add(island);
(function(){
  const g=new THREE.SphereGeometry(9,72,44);const pos=g.attributes.position;const col=[];
  const v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);const n=v.clone().normalize();const ang=Math.atan2(n.z,n.x);
    const jag=fbm(ang*1.3+4,n.y*2.5+1)-0.5;
    if(n.y>0){const top=n.y*9*0.10+fbm(v.x*0.25,v.z*0.25)*0.5;v.set(n.x*9*(1+jag*0.08),top,n.z*9*(1+jag*0.08));}
    else{const t=-n.y;const r=9*(1-t*0.82)*(1+jag*0.35);v.set(n.x*r,n.y*9*1.05-t*t*2.0,n.z*r);}
    pos.setXYZ(i,v.x,v.y,v.z);
    const soil=new THREE.Color(0x3f3220),rock=new THREE.Color(0x47423d),dark=new THREE.Color(0x221f1c);
    const c=n.y>0.08?soil:rock.clone().lerp(dark,Math.min(1,-n.y*1.2));c.offsetHSL(0,0,(fbm(v.x*0.6,v.z*0.6)-0.5)*0.12);col.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,flatShading:true}));m.receiveShadow=true;m.castShadow=true;island.add(m);
})();
const topY=(x,z)=>{const r=Math.hypot(x,z)/9;const ny=Math.sqrt(Math.max(0,1-r*r));return ny*9*0.10+fbm(x*0.25,z*0.25)*0.5;};

/* grass: instanced blades with a sway shader */
(function(){
  const blade=new THREE.PlaneGeometry(0.13,1,1,4);blade.translate(0,0.5,0);
  const bp=blade.attributes.position;for(let i=0;i<bp.count;i++){const y=bp.getY(i);bp.setX(i,bp.getX(i)*(1-y*0.85));bp.setZ(i,y*y*0.25);}
  const N=7000;const mesh=new THREE.InstancedMesh(blade,new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uSun:{value:SUN}},
    vertexShader:`uniform float uTime;varying float vY;varying vec3 vN;
     void main(){vec4 wp=vec4(position,1.);vec3 base=vec3(0.);
     #ifdef USE_INSTANCING
     wp=instanceMatrix*wp;base=(instanceMatrix*vec4(0.,0.,0.,1.)).xyz;
     #endif
     float t=uv.y;float sw=sin(uTime*1.5+base.x*.9+base.z*.7)*.22+sin(uTime*2.6+base.z*1.4+base.x*.3)*.08;
     wp.xyz+=vec3(sw,-abs(sw)*.35,sw*.5)*t*t;vY=t;vN=normalize(normalMatrix*normal);
     gl_Position=projectionMatrix*modelViewMatrix*wp;}`,
    fragmentShader:`uniform vec3 uSun;varying float vY;varying vec3 vN;
     void main(){vec3 lo=vec3(.09,.27,.07),hi=vec3(.58,.80,.27);vec3 c=mix(lo,hi,vY*vY);
     float rim=pow(1.-abs(vN.z),2.)*.25;c+=vec3(.9,.8,.4)*rim*vY;gl_FragColor=vec4(c,1.);}`,
    side:THREE.DoubleSide}),N);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3(),e=new THREE.Euler();
  let k=0;while(k<N){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*8.3;const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.hypot(x-0.2,z-0.6)<2.1)continue;
    p.set(x,topY(x,z)-0.05,z);e.set((rnd()-0.5)*0.4,rnd()*Math.PI*2,(rnd()-0.5)*0.4);q.setFromEuler(e);const h=0.55+rnd()*0.75;s.set(1,h,1);
    m.compose(p,q,s);mesh.setMatrixAt(k,m);k++;}
  mesh.instanceMatrix.needsUpdate=true;mesh.receiveShadow=true;island.add(mesh);island.userData.grass=mesh;
})();

/* rocks */
(function(){
  const mat=new THREE.MeshStandardMaterial({color:0x5a5753,roughness:0.95,flatShading:true});
  const spots=[[6.2,0,4.6,1.5],[-6.6,0,3.2,1.1],[-4.2,0,-6.6,1.3],[5.4,0,-5.8,0.9],[7.6,0,-1.2,0.7],[-7.4,0,-1.8,0.8],[1.5,0,-7.9,0.6]];
  for(const sp of spots){const g=new THREE.DodecahedronGeometry(sp[3],1);const pp=g.attributes.position;const v=new THREE.Vector3();
    for(let i=0;i<pp.count;i++){v.fromBufferAttribute(pp,i);const n=1+(fbm(v.x*1.3+sp[0],v.z*1.3+sp[2])-0.5)*0.5;pp.setXYZ(i,v.x*n*1.3,v.y*n*0.8,v.z*n);}
    g.computeVertexNormals();const r=new THREE.Mesh(g,mat);r.position.set(sp[0],topY(sp[0],sp[2])+sp[3]*0.25,sp[2]);r.rotation.y=rnd()*6;r.castShadow=true;r.receiveShadow=true;island.add(r);}
})();

/* ferns from a drawn texture */
(function(){
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');x.clearRect(0,0,256,256);
  x.strokeStyle='#2f6b2a';x.lineWidth=5;x.beginPath();x.moveTo(128,250);x.quadraticCurveTo(140,120,118,14);x.stroke();
  for(let i=0;i<16;i++){const t=i/16;const y=240-t*215;const len=(1-t)*62+8;const cx=128+Math.sin(t*3)*8;
    x.fillStyle=i%2?'#3f8a33':'#4f9d3b';
    for(const d of [-1,1]){x.beginPath();x.ellipse(cx+d*len*0.55,y+len*0.12,len*0.55,6-t*3,d*(-0.22+t*0.15),0,Math.PI*2);x.fill();}}
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;
  const mat=new THREE.MeshStandardMaterial({map:tex,transparent:true,alphaTest:0.5,side:THREE.DoubleSide,roughness:0.8});
  const spots=[[-5.5,5.6],[5.8,2.6],[-2.8,-6.8],[4.6,-6.4],[-7.2,0.6],[6.9,-3.6]];const ferns=[];
  for(const sp of spots){const grp=new THREE.Group();for(let i=0;i<3;i++){const pl=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.2),mat);pl.position.y=1.0;pl.rotation.y=i*Math.PI/3;pl.castShadow=true;grp.add(pl);}
    grp.position.set(sp[0],topY(sp[0],sp[1])-0.1,sp[1]);grp.rotation.y=rnd()*6;grp.scale.setScalar(0.8+rnd()*0.5);island.add(grp);ferns.push(grp);}
  island.userData.ferns=ferns;
})();

/* flowers */
(function(){
  const petal=new THREE.MeshStandardMaterial({color:0xfff3f6,roughness:0.7,side:THREE.DoubleSide});
  const heart=new THREE.MeshStandardMaterial({color:0xf2c14e,roughness:0.6});
  const stem=new THREE.MeshStandardMaterial({color:0x3e7a33,roughness:0.9});
  const clusters=[[4.4,5.2],[-5.8,-3.4],[2.2,-5.6],[-3.6,5.9],[6.6,0.6]];
  for(const cl of clusters)for(let i=0;i<5;i++){const x=cl[0]+(rnd()-0.5)*1.6,z=cl[1]+(rnd()-0.5)*1.6;const h=0.35+rnd()*0.35;
    const f=new THREE.Group();const st=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.03,h,5),stem);st.position.y=h/2;f.add(st);
    const head=new THREE.Group();head.position.y=h;head.rotation.x=-0.5+rnd()*0.4;
    for(let k=0;k<5;k++){const pm=new THREE.Mesh(new THREE.CircleGeometry(0.11,8),petal);pm.position.set(Math.cos(k*1.2566)*0.13,0,Math.sin(k*1.2566)*0.13);pm.rotation.x=-Math.PI/2;pm.rotation.z=k*1.2566;head.add(pm);}
    const hm=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6),heart);head.add(hm);f.add(head);
    f.position.set(x,topY(x,z)-0.05,z);island.add(f);}
})();

/* cushion, bamboo slips, staff */
const matC=new THREE.MeshStandardMaterial({color:0xc9a86a,roughness:0.95});
(function(){
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');x.fillStyle='#c9a86a';x.fillRect(0,0,256,256);
  x.strokeStyle='#9c7d45';x.lineWidth=3;for(let r=10;r<130;r+=12){x.beginPath();x.arc(128,128,r,0,Math.PI*2);x.stroke();}
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;
  const cushion=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.45,0.28,32),new THREE.MeshStandardMaterial({map:tex,roughness:0.95}));
  cushion.position.set(0.2,topY(0.2,0.6)+0.1,0.6);cushion.castShadow=true;cushion.receiveShadow=true;island.add(cushion);
  // bamboo slips, partly unrolled
  const slips=new THREE.Group();const bm=new THREE.MeshStandardMaterial({color:0xd8c48f,roughness:0.8});const tie=new THREE.MeshStandardMaterial({color:0x3a2a1a,roughness:0.9});
  for(let i=0;i<16;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.025,1.05),bm);s.position.x=i*0.125-1.0;
    if(i>11){const k=i-11;s.position.y=0.09*k;s.position.x=0.5+Math.sin(k*0.8)*0.12*k;s.rotation.z=-k*0.75;}slips.add(s);}
  for(const z of [-0.4,0.4]){const t=new THREE.Mesh(new THREE.BoxGeometry(1.55,0.035,0.03),tie);t.position.set(-0.25,0.02,z);slips.add(t);}
  slips.position.set(0.1,topY(0.1,2.3)+0.02,2.3);slips.rotation.y=0.25;slips.children.forEach(ch=>{ch.castShadow=true;ch.receiveShadow=true;});island.add(slips);
  const staff=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,3.2,7),new THREE.MeshStandardMaterial({color:0x6b4a2b,roughness:0.9}));
  staff.position.set(-2.1,topY(-2.1,1.2)+0.06,1.2);staff.rotation.z=Math.PI/2;staff.rotation.y=0.35;staff.castShadow=true;island.add(staff);
})();

/* the sage: an original old figure in a plain robe, sitting cross-legged */
const sage=new THREE.Group();
(function(){
  const robe=new THREE.MeshStandardMaterial({color:0xc9d3da,roughness:0.9});
  const robe2=new THREE.MeshStandardMaterial({color:0x4b6579,roughness:0.9});
  const skin=new THREE.MeshStandardMaterial({color:0xe8c3a0,roughness:0.7});
  const hair=new THREE.MeshStandardMaterial({color:0xf4f1ea,roughness:0.9});
  const legs=new THREE.Mesh(new THREE.SphereGeometry(1.0,24,16),robe);legs.scale.set(1.25,0.42,1.0);legs.position.y=0.32;sage.add(legs);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.9,1.5,24),robe);body.position.y=1.05;sage.add(body);
  const sash=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.72,0.16,24),robe2);sash.position.y=1.0;sage.add(sash);
  const collar=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.07,10,24),robe2);collar.position.y=1.75;collar.rotation.x=Math.PI/2;sage.add(collar);
  const head=new THREE.Group();head.position.y=2.2;sage.add(head);
  const face=new THREE.Mesh(new THREE.SphereGeometry(0.42,24,18),skin);head.add(face);
  const bun=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10),hair);bun.position.set(0,0.42,-0.05);head.add(bun);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.43,24,12,0,Math.PI*2,0,Math.PI*0.45),hair);cap.position.y=0.02;head.add(cap);
  const beard=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.75,12),hair);beard.position.set(0,-0.5,0.2);beard.rotation.x=Math.PI;beard.rotation.x=Math.PI+0.25;head.add(beard);
  for(const d of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6),new THREE.MeshStandardMaterial({color:0x2a1f17}));eye.position.set(d*0.15,0.05,0.38);head.add(eye);
    const brow=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.03,0.04),hair);brow.position.set(d*0.16,0.17,0.37);brow.rotation.z=d*0.25;head.add(brow);}
  // arms resting forward on the knees
  for(const d of [-1,1]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.24,1.1,14),robe);arm.position.set(d*0.62,1.0,0.45);arm.rotation.z=d*0.55;arm.rotation.x=-0.9;sage.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),skin);hand.position.set(d*0.78,0.55,0.95);sage.add(hand);}
  sage.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  sage.position.set(0.2,topY(0.2,0.6)+0.2,0.6);sage.rotation.y=0.15;sage.scale.setScalar(0.95);island.add(sage);
  sage.userData.head=head;sage.userData.body=body;
})();

/* butterfly */
const fly=new THREE.Group();
(function(){
  const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
  x.fillStyle='#f6c744';x.beginPath();x.ellipse(70,50,50,38,-0.3,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(64,92,36,26,0.2,0,Math.PI*2);x.fill();
  x.fillStyle='#3b2a1a';x.beginPath();x.arc(96,34,10,0,Math.PI*2);x.fill();x.beginPath();x.arc(82,98,7,0,Math.PI*2);x.fill();
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;
  const m=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.4,side:THREE.DoubleSide});
  for(const d of [-1,1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5),m);w.position.x=d*0.25;if(d<0)w.scale.x=-1;const pivot=new THREE.Group();pivot.add(w);fly.add(pivot);}
  const bd=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4,6),new THREE.MeshStandardMaterial({color:0x2a1f17}));bd.rotation.x=Math.PI/2;fly.add(bd);
  scene.add(fly);
})();

/* drifting petals */
const PN=160;const petalGeo=new THREE.BufferGeometry();const pp=new Float32Array(PN*3);const pv=[];
for(let i=0;i<PN;i++){pp[i*3]=(rnd()-0.5)*26;pp[i*3+1]=rnd()*14-2;pp[i*3+2]=(rnd()-0.5)*26;pv.push(rnd()*6.28,0.4+rnd()*0.6);}
petalGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
const petalTex=(function(){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');const g=x.createRadialGradient(16,16,2,16,16,16);g.addColorStop(0,'rgba(255,240,235,1)');g.addColorStop(0.5,'rgba(255,230,225,.8)');g.addColorStop(1,'rgba(255,230,225,0)');x.fillStyle=g;x.fillRect(0,0,32,32);const t=new THREE.CanvasTexture(c);return t;})();
const petals=new THREE.Points(petalGeo,new THREE.PointsMaterial({map:petalTex,color:0xfff0e8,size:0.22,transparent:true,opacity:0.9,depthWrite:false,sizeAttenuation:true}));scene.add(petals);

/* camera orbit (drag / wheel / touch) */
let theta=0.55,phi=1.34,radius=19,autoTheta=true;const target=new THREE.Vector3(0.2,2.4,0.6);
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);autoTheta=false;});
canvas.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-drag.x)*0.005;phi=Math.min(1.45,Math.max(0.6,phi-(e.clientY-drag.y)*0.004));drag={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>{autoTheta=true;},6000);});
canvas.addEventListener('pointercancel',()=>{drag=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.min(26,Math.max(9,radius+e.deltaY*0.01));},{passive:false});
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

/* loop */
const clock=new THREE.Clock();let t=0;
function frame(){
  const dt=Math.min(0.05,clock.getDelta());if(!reduced)t+=dt;
  if(playing&&!reduced){ct+=dt;if(ct>=HOLD)show(ci+1);}
  if(autoTheta&&!reduced)theta+=dt*0.045;
  camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
  island.position.y=Math.sin(t*0.4)*0.25;island.rotation.y=Math.sin(t*0.13)*0.02;
  cloudMat.uniforms.uTime.value=t;island.userData.grass.material.uniforms.uTime.value=t;
  island.userData.ferns.forEach((f,i)=>{f.rotation.z=Math.sin(t*1.3+i)*0.05;});
  const hd=sage.userData.head;hd.rotation.x=0.18+Math.sin(t*0.5)*0.05;hd.rotation.y=Math.sin(t*0.23)*0.12;sage.userData.body.scale.y=1+Math.sin(t*1.1)*0.012;
  const fa=t*0.35;fly.position.set(Math.cos(fa)*5.5+Math.sin(t*0.9)*0.8,island.position.y+3.2+Math.sin(t*1.7)*0.6,Math.sin(fa*1.3)*4.5);
  fly.rotation.y=-fa*1.3+Math.PI/2;fly.children[0].rotation.y=-Math.abs(Math.sin(t*18))*1.1;fly.children[1].rotation.y=Math.abs(Math.sin(t*18))*1.1;
  const arr=petalGeo.attributes.position.array;
  for(let i=0;i<PN;i++){arr[i*3+1]-=pv[i*2+1]*dt;arr[i*3]+=Math.sin(t*0.8+pv[i*2])*dt*0.6;if(arr[i*3+1]<-3){arr[i*3+1]=12;arr[i*3]=(rnd()-0.5)*26;arr[i*3+2]=(rnd()-0.5)*26;}}
  petalGeo.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
